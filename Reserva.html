<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
    <link rel="stylesheet" href="estilotabela.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

        <main>

            <p>Home / Reservas</p>

            <form>
                <fieldset>

                    <h2>Reservas</h2>

                    <a style="margin-bottom: 2%;" class="voltar" href="FazerReserva.html">+ Nova Reserva </a>

                    <fieldset class="fieldsetinterno">

                        <div class="linha-formulario">

                            <div class="campo">
                                <label for="id">Id:</label>
                                <input type="text" id="id">
                            </div>   

                            <div class="campo">
                                <label for="periodo">Período:</label>
                                <div class="data">
                                    <input type="date" id="periodo">
                                    <input type="date">
                                </div>
                            </div>

                        </div>

                        <div class="linha-formulario">

                            <div class="campo">
                                <label for="proprietario">Proprietário:</label>
                                <input type="text" id="proprietario">
                            </div>

                            <div class="campo">
                                <label for="total">Total:</label>
                                <div class="data">
                                    <input type="number" id="total" step="0.01">
                                    <input type="number" step="0.01">
                                </div>
                            </div>

                        </div>

                        <div class="linha-formulario">

                            <div class="campo">
                                <label for="status">Status:</label>
                                <select name="status" id="status">
                                    <option value="">Selecione</option>
                                    <option value="em progresso">Em progresso</option>
                                    <option value="reservada">Reservada</option>
                                    <option value="finalizada">Finalizada</option>
                                </select>
                            </div>

                            <div class="campo">
                                <label for="pet">Pet:</label>
                                <input type="text" id="pet">
                            </div>

                        </div>

                        <section class="BotoesPesquisarLimpar">

                            <button type="button" onclick="pesquisarTabela()">
                                <img src="Imagens/pesquisar.jpg" width="20" height="20" alt="Ícone de Pesquisar">
                                Pesquisar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg" width="20" height="20" alt="Ícone de limpar">
                                Limpar
                            </button>

                            <button type="button" data-navegacao="voltar">
                                Voltar
                            </button>

                        </section>

                    </fieldset>

                    <fieldset>
                        <table>
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Id</th>
                                    <th>Pet</th>
                                    <th>Chegada</th>
                                    <th>Partida</th>
                                    <th>Status</th>
                                    <th>Total</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <!-- Adicionado o ID e esvaziado as linhas fixas -->
                            <tbody id="tabelaReservasBody">
                                <!-- O scriptLista.js vai preencher esta tabela dinamicamente com os dados salvos -->
                            </tbody>

                        </table>
                    </fieldset>

                </fieldset>
            </form>

            <script src="dados.js"></script>
            <script src="scriptLista.js"></script>
            <script src="script.js"></script>
            <script src="pesquisa.js"></script>

        </main>

    </div>
</body>

</html>
