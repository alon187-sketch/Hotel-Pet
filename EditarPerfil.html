<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

            <div class="layout">

                    <header>
                        <h1>Hotel Pet</h1>

                        <a href="Pets.html">
                            <img src="Imagens/pet.jpg" alt="Ícone de pet"> Pets
                        </a>

                        <a href="Usuarios.html">
                            <img src="Imagens/usuários.jpg" alt="Ícone de usuários" >Usuários
                        </a>
            
                        <a href="Configuracoes.html">
                            <img src="Imagens/configuracoes.jpg" alt="Ícone de configurações" align="center">Configurações
                        </a>
                    
                        <a href="Reserva.html">
                            <img src="Imagens/reservas.jpg" alt="Ícone de reservas">Reservas
                        </a>
                    </header>
            
                <section>
                        <p>
                            <img src="Imagens/usuário.jpg" height="50" width="50" alt="Imagem do usuário" style="vertical-align: middle; align: center">

                            João da Silva
                        </p>
                </section>

                <main>

                    <p>Home / Editar Perfil</p>

                    <form>
                        <fieldset>

                            <h2>Editar Perfil</h2>

                            <p>
                                <label>
                                    Email*<br>
                                    <input type="email">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Nome*<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Sobrenome*<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Telefone*<br>
                                    <input type="number">
                                </label>
                            </p>

                           
                            <p>
                                <label>
                                    Função<br>

                                <select name="funcao">
                                    <option value="Funcionario">Funcionário</option>
                                    <option value="Gerente">Gerente</option>
                                    <option value="cliente">Cliente</option>
                                </select>
                                </label>

                            </p>


                            <div class="imagembaixo">
                                <img src="Imagens/quadrodo comx.jpg"
                                    width="100"
                                    height="100"
                                    alt="Imagem">
                            </div>

                            <br>

                            <button type="submit">
                                <img src="Imagens/salvar.jpg" width="20" height="20" alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg" width="20" height="20" alt="Ícone de limpar">
                                Limpar
                            </button>

                        </fieldset>
                    </form>
                </main>
    </body>

</html>
