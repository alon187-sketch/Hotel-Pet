<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="EstiloPaginaInicial.css">

</head>

<body>

    <div class="layout">

        <header>
            <img src="Imagens/quadrodo comx.jpg"
                 alt="Imagem do Hotel Pet">
        </header>

        <main>

            <form>

                <fieldset>

                    <h2>Hotel Pet</h2>

                    <div class="campo">
                        <label for="login">
                            <input type="text"
                                   id="login"
                                   name="login"
                                   placeholder="Login">
                        </label>
                    </div>

                    <div class="campo">
                        <label for="senha">
                            <input type="password"
                                   id="senha"
                                   name="senha"
                                   placeholder="Senha">
                        </label>
                    </div>

                    <div class="opcoes">

                        <label for="conectado">
                            <input type="checkbox"
                                   id="conectado"
                                   name="conectado">
                            Mantenha-me conectado
                        </label>

                        <a href="esqueci-senha.html">
                            Esqueci a senha
                        </a>

                    </div>

                    <button class="botao" type="submit">
                        Enviar
                    </button>

                    <div class="separador">
                        <span>OU</span>
                    </div>

                    <div class="redes">

                        <a href="https://www.facebook.com" target="_blank">
                            <img src="Imagens/facebook.jpg"
                                 alt="Facebook">
                        </a>

                        <a href="https://twitter.com" target="_blank">
                            <img src="Imagens/twitter.jpg"
                                 alt="Twitter">
                        </a>

                        <a href="https://www.google.com" target="_blank">
                            <img src="Imagens/google.jpg"
                                 alt="Google">
                        </a>

                    </div>

                    <p class="criar-conta">
                        <a href="CriarConta.html">
                            Criar uma conta
                        </a>
                    </p>

                </fieldset>

            </form>

        </main>

    </div>

</body>

</html>
