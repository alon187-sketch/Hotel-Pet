<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

        <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

            <main>
                <p>Home / Usuário / Novo usuário</p>

                <form>
                    <fieldset>
                        <h2>Editar Perfil</h2>

                        <p>
                            <label>
                                Email*<br>
                                <input type="email" required>
                            </label>
                        </p>

                        <p>
                            <label>
                                Nome*<br>
                                <input type="text" required>
                            </label>
                        </p>

                        <p>
                            <label>
                                Sobrenome*<br>
                                <input type="text" required>
                            </label>
                        </p>

                        <p>
                            <label>
                                Telefone*<br>
                                <input type="number" required>
                            </label>
                        </p>

                        <p>
                            <label>
                                Função<br>

                            <select name="funcao">
                                <option value="Funcionario">Funcionário</option>
                                <option value="Gerente">Gerente</option>
                                <option value="cliente">Cliente</option>
                            </select>
                             </label>

                        </p>
                            <div class="imagembaixo">
                                <img src="Imagens/quadrodo comx.jpg"
                                    width="100"
                                    height="100"
                                    alt="Imagem">
                            </div>

                            <p class="BotoesSalvarLimpar">
                                <button type="submit">
                                    <img src="Imagens/salvar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de salvar">
                                    Salvar
                                </button>

                                <button type="reset">
                                    <img src="Imagens/limpar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de limpar">
                                    Limpar
                                </button>

                                <button type="button" data-navegacao="voltar">
                                    Voltar
                                </button>  
                            </p>
                            
                    </fieldset>
                </form>
            </main>

    <script src="script.js"></script>

    </body>

</html>
