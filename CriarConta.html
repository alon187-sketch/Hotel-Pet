<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="EstiloPaginaInicial.css">

</head>

<body>

    <div class="layout">

        <header>
            <img src="Imagens/quadrodo comx.jpg"
                 alt="Imagem do Hotel Pet">
        </header>

        <main>

            <form>

                <fieldset>

                    <h2>Hotel Pet</h2>

                    <div class="campo">
                        <label for="login">
                            <input type="text"
                                   id="login"
                                   name="login"
                                   placeholder="Login">
                        </label>
                    </div>

                    <div class="campo">
                        <label for="senha">
                            <input type="password"
                                   id="senha"
                                   name="senha"
                                   placeholder="Senha">
                            <i class="fa-solid fa-eye" id="btn-senha"></i>
                        </label>
                    </div>


                    <button class="botao" type="submit">
                        Criar Conta
                    </button>

                    <div class="separador">
                        <span>OU</span>
                    </div>

                    <p class="criar-conta">
                        <a href="CadastrarUsuario.html">
                            Criar uma conta?Login
                        </a>
                    </p>

                </fieldset>

            </form>

        </main>

    </div>

</body>

</html>
