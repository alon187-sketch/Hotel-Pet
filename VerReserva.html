<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Reserva</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
    

    <style>
        table td:first-child {
            text-align: right;
        }

        table td:nth-child(2) {
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="layout">

        <header>
            <h1>Hotel Pet</h1>

            <a href="Pets.html">
                <img src="Imagens/pet.jpg" alt="Ícone de pet">
                Pets
            </a>

            <a href="Reserva.html">
                <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                Reservas
            </a>
        </header>

        <div id="cabecalho"></div>

        <main>
            <p>Home / Reservas / Ver Reserva</p>

            <fieldset>
                <h2>Detalhes da Reserva</h2>

                <p>ID da Reserva: <span id="viewId">--</span></p>
                <p>Proprietário: <span id="viewProprietario">--</span></p>
                <p>Pet: <span id="viewNomePet">--</span></p>
                <p>Data de Chegada: <span id="viewChegada">--</span></p>
                <p>Data de Partida: <span id="viewPartida">--</span></p>
                <p>Status: <span id="viewStatus">--</span></p>
                <p>Total: <span id="viewTotal">--</span></p>
                <p>Notas: <span id="viewNotas">--</span></p>

                <br>

                <p class="BotoesSalvarLimpar">
                    <a id="btnEditarReserva" class="voltar" href="#">Editar</a>
                    <button type="button" data-navegacao="voltar">Voltar</button>
                </p>

            </fieldset>
        </main>

    </div>

    <script src="dados.js"></script>
    <script src="scriptLista.js"></script>
    <script src="script.js"></script>
    <script src="VerReserva.js"></script>

</body>

</html>
