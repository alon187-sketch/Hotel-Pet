<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Reserva</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

        <main>
            <p>Home / Reservas / Fazer Reserva</p>

            <form id="formCadastrarReserva">
                <fieldset>
                    <h2>Fazer Reserva</h2>

                    <p>
                        <label>
                            Proprietário*<br>
                            <input type="text" id="proprietarioReserva" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Nome do Pet*<br>
                            <input type="text" id="nomePetReserva" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Data de Chegada*<br>
                            <input type="date" id="chegadaReserva" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Data de Partida*<br>
                            <input type="date" id="partidaReserva" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Notas / Observações<br>
                            <textarea id="notasReserva"></textarea>
                        </label>
                    </p>

                    <p>
                        <label>
                            Total (R$)<br>
                            <input type="text" id="totalReserva" placeholder="Ex: R$ 40,00" value="R$ 40,00">
                        </label>
                    </p>

                    <p class="BotoesSalvarLimpar">
                        <button type="submit">
                            <img src="Imagens/salvar.jpg" width="20" height="20" alt="Ícone de salvar">
                            Salvar
                        </button>

                        <button type="reset">
                            <img src="Imagens/limpar.jpg" width="20" height="20" alt="Ícone de limpar">
                            Limpar
                        </button>

                        <button type="button" data-navegacao="voltar">
                            Voltar
                        </button>
                    </p>

                </fieldset>
            </form>
        </main>

    </div>

    <!-- Scripts na ordem correta -->
    <script src="dados.js"></script>
    <script src="script.js"></script>
    <script src="CadastrarReserva.js"></script>

</body>

</html>
