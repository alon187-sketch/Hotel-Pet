<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Fazer Reserva</title>
</head>

<body>

    <table border="1" width="100%">
        <tr>
            <td rowspan="2" width="20%">

                <header>
                    <h1>Hotel Pet</h1>

                    <a href="Pets.html">
                        <img src="Imagens/pet.jpg" width="20" height="20" alt="Ícone de pet">
                        Pet
                    </a>
                    <br>

                    <a href="Reserva.html">
                        <img src="Imagens/reservas.jpg" width="20" height="20" alt="Ícone de reservas">
                        Reservas
                    </a>
                </header>

            </td>

            <td>
                <p>
                    <img src="Imagens/usuário.jpg" height="50" width="50" alt="Imagem do usuário">
                </p>

                <p>João da Silva</p>
            </td>
        </tr>

        <tr>
            <td>

                <p>Home / Reservas / Nova reserva</p>

                <h2>Fazer reserva</h2>

                <form>
                    <fieldset>

                        <p>
                            <label>
                                Pet *<br>
                                <input type="text">
                            </label>
                        </p>

                        <p>
                            <label>
                                Período *<br>
                                <input type="date">
                                <input type="date">
                            </label>
                        </p>

                        <p>
                            <label>
                                Notas<br>
                                <textarea rows="5" cols="50"></textarea>
                            </label>
                        </p>

                        <p>
                            Total das diárias: <strong>R$ 40,00</strong>
                        </p>

                        <p>
                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>
                        </p>

                    </fieldset>
                </form>

            </td>
        </tr>
    </table>

</body>

</html>
