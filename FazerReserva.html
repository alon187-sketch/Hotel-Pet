<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Fazer Reserva</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

        <main>

            <p>Home / Reservas / Nova reserva</p>

                <form>
                    <fieldset>

                        <h2>Fazer reserva</h2>

                        <p>
                            <label>
                                Pet *<br>
                                <input type="text">
                            </label>
                        </p>

                        <p>
                            <div>
                                <label for="Periodo"> Período:</label>
                                <div class="data"  style="margin-left: 5%; width: 60%;">
                                    <input type="date" id="criado">
                                    <input type="date" style="margin-left: 10%;">
                                </div>
                        </div>
                        </p>

                        <p>
                            <label>
                                Notas<br>
                                <textarea rows="5" cols="50"></textarea>
                            </label>
                        </p>

                        <p>
                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>
                        </p>

                        <p class="BotoesSalvarLimpar">
                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>
                                                            
                            <button type="button" data-navegacao="voltar">
                                Voltar
                            </button>
                        </p>

                    </fieldset>
                </form>

        <script src="script.js"></script>
</body>

</html>
