<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pet</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

        <main>
            <p>Home / Pet / Novo Pet</p>

            <form>
                <fieldset>

                    <h2>Novo Pet</h2>

                    <div class="imagemlado">
                        <img src="Imagens/quadrodo comx.jpg"
                            width="200"
                            height="200"
                            alt="Imagem">
                    </div>

                    <p>
                        <label>
                            Proprietário*<br>
                            <input type="text" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Nome*<br>
                            <input type="text" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Tipo*<br>
                            <input type="text" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Raça*<br>
                            <input type="text">
                        </label>
                    </p>

                    <p>
                        <label>
                            Tamanho*<br>
                            <input type="number" step="0.01">
                        </label>
                    </p>

                    <p class="BotoesSalvarLimpar">
                        <button type="submit">
                            <img src="Imagens/salvar.jpg"
                                    width="20"
                                    height="20"
                                    alt="Ícone de salvar">
                            Salvar
                        </button>

                        <button type="reset">
                            <img src="Imagens/limpar.jpg"
                                    width="20"
                                    height="20"
                                    alt="Ícone de limpar">
                            Limpar
                        </button>
                        <button type="button" data-navegacao="voltar">
                            Voltar
                        </button>
                    </p>

                </fieldset>
            </form>
        </main>

    </div>

    <script src="script.js"></script>


</body>

</html>
