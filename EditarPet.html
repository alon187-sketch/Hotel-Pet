<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pet</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="layout">

        <header>
            <h1>Hotel Pet</h1>

            <a href="Pets.html">
                <img src="Imagens/pet.jpg" alt="Ícone de pet">
                Pets
            </a>

            <a href="Usuarios.html">
                <img src="Imagens/usuários.jpg" alt="Ícone de usuários">
                Usuários
            </a>

            <a href="Reserva.html">
                <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                Reservas
            </a>
        </header>

        <div id="cabecalho"></div>

        <main>
            <p>Home / Pet / Editar Pet</p>

            <form>
                <fieldset>

                    <h2>Editar Pet</h2>

                    <img class="imagemlado" src="Imagens/quadrodo comx.jpg" width="200" height="200" alt="Imagem">

                    <!-- Campo ID Oculto para sincronizar com a URL sem alterar a interface -->
                    <input type="hidden" id="idPet">

                    <p>
                        <label>
                            Nome*<br>
                            <input type="text" id="nomePet" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Tipo*<br>
                            <input type="text" id="tipoPet" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Raça*<br>
                            <input type="text" id="racaPet" required>
                        </label>
                    </p>

                    <p>
                        <label>
                            Tamanho*<br>
                            <input type="text" id="tamanhoPet" required>
                        </label>
                    </p>

                    <br>

                    <p class="BotoesSalvarLimpar">
                        <button type="submit">
                            <img src="Imagens/salvar.jpg" width="20" height="20" alt="Ícone de salvar">
                            Salvar
                        </button>

                        <button type="reset">
                            <img src="Imagens/limpar.jpg" width="20" height="20" alt="Ícone de limpar">
                            Limpar
                        </button>

                        <button type="button" data-navegacao="voltar">
                            Voltar
                        </button>
                    </p>

                </fieldset>
            </form>
        </main>
    </div>

    <!-- Ordem correta de carregamento dos scripts -->
    <script src="dadosPets.js"></script>
    <script src="script.js"></script>
    <script src="EditarPet.js"></script>
</body>

</html>
