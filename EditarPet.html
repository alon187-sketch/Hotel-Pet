<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pet</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

        <div class="layout">

            <header>
                <h1>Hotel Pet</h1>

                <a href="Pets.html">
                    <img src="Imagens/pet.jpg" alt="Ícone de pet">
                    Pets
                </a>

                <a href="Usuarios.html">
                    <img src="Imagens/usuários.jpg" alt="Ícone de usuários">
                    Usuários
                </a>

                <a href="Reserva.html">
                    <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                    Reservas
                </a>
            </header>

            <section>
                <p>
                    <img src="Imagens/usuário.jpg"
                        width="50"
                        height="50"
                        alt="Imagem do usuário">
                    João da Silva
                </p>
            </section>

            <main>
                <p>Home / Pet / Editar Pet</p>

                <form>
                    <fieldset>
                        
                        <h2>Editar Pet</h2>

                        <img class="imagemlado" src="Imagens/quadrodo comx.jpg"
                            width="200"
                            height="200"
                            alt="Imagem">

                        <p>
                            <label>
                                Nome*<br>
                                <input type="text">
                            </label>
                        </p>

                        <p>
                            <label>
                                Tipo*<br>
                                <input type="text">
                            </label>
                        </p>

                        <p>
                            <label>
                                Raça*<br>
                                <input type="text">
                            </label>
                        </p>

                        <p>
                            <label>
                                Tamanho*<br>
                                <input type="number" step="0.01">
                            </label>
                        </p>

                        <br>

                        <p class="BotoesSalvarLimpar">
                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>
                        </p>

                    </fieldset>
                </form>
            </main>
</body>

</html>
