<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pet</title>
</head>

<body>

    <table border="1" width="100%">
        <tr>
            <td rowspan="2" width="20%">

                <header>
                    <h1>Hotel Pet</h1>

                    <a href="Pets.html">
                        <img src="Imagens/pet.jpg" width="20" height="20" alt="Ícone de pet">
                        Pet
                    </a>
                    <br>

                    <a href="Usuarios.html">
                        <img src="Imagens/usuários.jpg" width="20" height="20" alt="Ícone de usuários">
                        Usuários
                    </a>
                    <br>

                    <a href="Reserva.html">
                        <img src="Imagens/reservas.jpg" width="20" height="20" alt="Ícone de reservas">
                        Reservas
                    </a>
                </header>

            </td>

            <td>
                <p>
                    <img src="Imagens/usuário.jpg" height="50" width="50" alt="Imagem do usuário">
                </p>

                <p>João da Silva</p>
            </td>
        </tr>

        <tr>
            <td>

                <main>
                    <p>Home / Pet / Editar Pet</p>

                    <form>
                        <fieldset>

                            <h2>Editar Pet</h2>

                            <img src="Imagens/quadrodo comx.jpg"
                                 width="150"
                                 height="150"
                                 alt="Imagem com X"
                                 align="right">

                            <p>
                                <label>
                                    Nome*<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Tipo*<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Raça*<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Tamanho*<br>
                                    <input type="number" step="0.01">
                                </label>
                            </p>

                            <br>

                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>

                        </fieldset>
                    </form>
                </main>

            </td>
        </tr>
    </table>

</body>

</html>
