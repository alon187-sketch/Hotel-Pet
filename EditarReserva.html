<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Reserva</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <h1>Hotel Pet</h1>

            <a href="Pets.html">
                <img src="Imagens/pet.jpg" alt="Ícone de pet">
                Pets
            </a>

            <a href="Usuarios.html">
                <img src="Imagens/usuários.jpg" alt="Ícone de usuários">
                Usuários
            </a>

            <a href="Configuracoes.html">
                <img src="Imagens/configuracoes.jpg" alt="Ícone de configurações">
                Configurações
            </a>

            <a href="Reserva.html">
                <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                Reservas
            </a>
        </header>

        <section>
            <p>
                <img src="Imagens/usuário.jpg"
                     width="50"
                     height="50"
                     alt="Imagem do usuário">
                João da Silva
            </p>
        </section>

        <main>
                <p>Home / Reservas / Editar reserva</p>


                <form>
                    <fieldset>

                           <h2>Editar reserva</h2>

                           <p>
                                <label>
                                    Proprietário *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Pet *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <div>
                                    <label for="Periodo">Periodo:</label>
                                    <div class="data"  style="margin-left: 5%; width: 60%;">
                                        <input type="date" id="criado">
                                        <input type="date" style="margin-left: 10%;">
                                    </div>
                            </div>
                            </p>

                            <p>
                                <label>
                                    Notas<br>
                                    <textarea> </textarea>
                                 </label>
                            </p>

                            <p>
                                <label>Status*</label>

                                <select style="margin-left: 5%; width: 60%;">
                                    <option value="Reservado" selected>Reservado</option>
                                    <option value="em-andamento">Em andamento</option>
                                    <option value="cancelado">Cancelado</option>
                                    <option value="finalizado">Finalizado</option>
                                </select>
                            </p>



                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>
                        
                            <p class="BotoesSalvarLimpar">
                                <button type="submit">
                                    <img src="Imagens/salvar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de salvar">
                                    Salvar
                                </button>

                                <button type="reset">
                                    <img src="Imagens/limpar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de limpar">
                                    Limpar
                                </button>
                            </p>

                    </fieldset>
                </form>
    </main>
</body>

</html>
