<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Reserva Finalizada</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>
        <main>
                <p>Home / Reservas / Editar reserva</p>


                <form>
                    <fieldset>

                           <h2>Editar reserva</h2>

                           <p>
                                <label>
                                    Proprietário *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Pet *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <div>
                                    <label for="Periodo">Período:</label>
                                    <div class="data"  style="margin-left: 5%; width: 60%;">
                                        <input type="date" id="criado">
                                        <input type="date" style="margin-left: 10%;">
                                    </div>
                            </div>
                            </p>

                            <p>
                                <label>
                                    Notas<br>
                                    <textarea> </textarea>
                                 </label>
                            </p>

                            <p>
                                <label>Status*</label>

                                <select style="margin-left: 5%; width: 60%;">
                                    <option value="Finalizada" selected>Finalizada</option>
                                    <option value="em-andamento">Em andamento</option>
                                    <option value="cancelado">Cancelado</option>
                                    <option value="Reservado">Reservado</option>
                                </select>
                            </p>

                            <p>
                            <label>
                                
                                <span style="    display: inline-block;
                                                padding: 12px 20px;
                                                background-color: #B000E0;
                                                color: white;
                                                border-radius: 5px;
                                                text-decoration: none;
                                                cursor: pointer;
                                                text-align: center;"
                                                </span> <img src="Imagens/finalizada.svg"
                                                    width="25"
                                                    height="25"
                                                    alt="Finalizado"> 
                                                    Adicionar nota Fiscal</span>
                                <input style="display: none;" type="file" required>
                            </label>
                            </p>

                            <p>
                                <a style="margin-left: 5%;" href="#">recibo.pdf</a>
                            </p>

                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>
                        
                            <p class="BotoesSalvarLimpar">
                                <button type="submit">
                                    <img src="Imagens/salvar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de salvar">
                                    Salvar
                                </button>

                                <button type="reset">
                                    <img src="Imagens/limpar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de limpar">
                                    Limpar
                                </button>
                                                                
                                <button type="button" data-navegacao="voltar">
                                Voltar
                                </button>
                            </p>

                    </fieldset>
                </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
