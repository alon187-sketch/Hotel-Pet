<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Reserva em andamento</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <h1>Hotel Pet</h1>

            <a href="Pets.html">
                <img src="Imagens/pet.jpg" alt="Ícone de pet">
                Pets
            </a>

            <a href="Usuarios.html">
                <img src="Imagens/usuários.jpg" alt="Ícone de usuários">
                Usuários
            </a>

            <a href="Configuracoes.html">
                <img src="Imagens/configuracoes.jpg" alt="Ícone de configurações">
                Configurações
            </a>

            <a href="Reserva.html">
                <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                Reservas
            </a>
        </header>

        <section>
            <p>
                <img src="Imagens/usuário.jpg"
                     width="50"
                     height="50"
                     alt="Imagem do usuário">
                João da Silva
            </p>
        </section>

        <main>
                <p>Home / Reservas / Editar reserva</p>


                <form>
                    <fieldset>

                           <h2>Editar reserva</h2>

                           <p>
                                <label>
                                    Proprietário *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Pet *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <div>
                                    <label for="criado">Criado em:</label>
                                    <div class="data"  style="margin-left: 5%; width: 60%;">
                                        <input type="date" id="criado">
                                        <input type="date" style="margin-left: 10%;">
                                    </div>
                            </div>
                            </p>

                            <p>
                                <label>
                                    Notas<br>
                                    <textarea> </textarea>
                                 </label>
                            </p>

                            <p>
                                <label>Status*</label>

                                <select style="margin-left: 5%; width: 60%;">
                                    <option value="em-andamento" selected>Em andamento</option>
                                    <option value="concluido">Concluído</option>
                                    <option value="cancelado">Cancelado</option>
                                </select>
                            </p>

                            <p>
                                <label>
                                    Anotações do funcionário<br>
                                    <textarea> </textarea>
                                </label>
                            </p>

                            <img class="imagembaixo" src="Imagens/quadrodo comx.jpg"
                                 width="80"
                                 height="80"
                                 alt="Imagem com X"
                                 align="left">

                            <button type="button" 
                            style="width:80px; 
                            height:80px; 
                            background-color: gainsboro; 
                            font-size: 30px; 
                            border:none; 
                            border-radius: 0; 
                            color: gray ">
                                +
                            </button>

                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>

                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>

                    </fieldset>
                </form>
    </main>
</body>

</html>
