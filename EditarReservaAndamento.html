<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Reserva em andamento</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>
        <main>
                <p>Home / Reservas / Editar reserva</p>


                <form>
                    <fieldset>

                           <h2>Editar reserva</h2>

                           <p>
                                <label>
                                    Proprietário *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <label>
                                    Pet *<br>
                                    <input type="text">
                                </label>
                            </p>

                            <p>
                                <div>
                                    <label for="criado">Criado em:</label>
                                    <div class="data"  style="margin-left: 5%; width: 60%;">
                                        <input type="date" id="criado">
                                        <input type="date" style="margin-left: 10%;">
                                    </div>
                            </div>
                            </p>

                            <p>
                                <label>
                                    Notas<br>
                                    <textarea> </textarea>
                                 </label>
                            </p>

                            <p>
                                <label>Status*</label>

                                <select style="margin-left: 5%; width: 60%;">
                                    <option value="em-andamento" selected>Em andamento</option>
                                    <option value="concluido">Concluído</option>
                                    <option value="cancelado">Cancelado</option>
                                </select>
                            </p>

                            <p>
                                <label>
                                    Anotações do funcionário<br>
                                    <textarea> </textarea>
                                </label>
                            </p>

                            <img class="imagembaixo" src="Imagens/quadrodo comx.jpg"
                                 width="80"
                                 height="80"
                                 alt="Imagem com X"
                                 align="left">

                            <button type="button" 
                            style="width:80px; 
                            height:80px; 
                            background-color: gainsboro; 
                            font-size: 30px; 
                            border:none; 
                            border-radius: 0; 
                            color: gray ">
                                +
                            </button>

                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>
                        
                            <p class="BotoesSalvarLimpar">
                                <button type="submit">
                                    <img src="Imagens/salvar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de salvar">
                                    Salvar
                                </button>

                                <button type="reset">
                                    <img src="Imagens/limpar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de limpar">
                                    Limpar
                                </button>      
                                
                                <button type="button" data-navegacao="voltar">
                                Voltar
                                </button>
                            </p>

                    </fieldset>
                </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
