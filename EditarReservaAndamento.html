<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Reserva em andamento</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">

        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>
        <main>
                <p>Home / Reservas / Editar reserva Em andamento</p>


                <form>
                    <fieldset>

                           <h2>Editar reserva</h2>

                                <label>
                                    ID:<br>
                                    <input type="text" id="idReserva" disabled>
                                </label>


                           <p>
                                <label>
                                    Proprietário*<br>
                                    <input type="text" id="proprietario" required>
                                </label>
                            </p>

                            <p>
                                <label>
                                    Pet *<br>
                                    <input type="text" id="nomePet" required>
                                </label>
                            </p>

                            <p>
                                <div>
                                    <label for="criado">Criado em:</label>
                                    <div class="data"  style="margin-left: 5%; width: 60%;">
                                        <input type="date" id="chegada">
                                        <input type="date" style="margin-left: 10%;" id="partida">
                                    </div>
                            </div>
                            </p>

                            <p>
                                <label for="notas">
                                    Notas<br>
                                    <textarea id="notas"> </textarea>
                                 </label>
                            </p>

                            <p>
                                <label for="status">Status*</label>
                                <select id="status" style="margin-left: 5%; width: 60%;">
                                    <option value="Em Progresso">Em progresso</option>
                                    <option value="Finalizada">Concluído</option>
                                    <option value="Reservada">Reservada</option>
                                    <option value="cancelado">Cancelado</option>

                                </select>
                            </p>

                            <p>
                                <label for="anotacoes">
                                    Anotações do funcionário<br>
                                    <textarea id="anotacoes"> </textarea>
                                </label>
                            </p>

                            <img class="imagembaixo" src="Imagens/quadrodo comx.jpg"
                                 width="80"
                                 height="80"
                                 alt="Imagem com X"
                                 align="left">

                            <button type="button" 
                            style="width:80px; 
                            height:80px; 
                            background-color: gainsboro; 
                            font-size: 30px; 
                            border:none; 
                            border-radius: 0; 
                            color: gray ">
                                +
                            </button>

                            <p style="margin-left: 5%;">Total das diárias: <strong> R$ 40,00</strong> </p>
                        
                            <p class="BotoesSalvarLimpar">
                                <button type="submit">
                                    <img src="Imagens/salvar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de salvar">
                                    Salvar
                                </button>

                                <button type="reset">
                                    <img src="Imagens/limpar.jpg"
                                        width="20"
                                        height="20"
                                        alt="Ícone de limpar">
                                    Limpar
                                </button>      
                                
                                <button type="button" data-navegacao="voltar">
                                Voltar
                                </button>
                            </p>

                    </fieldset>
                </form>
    </main>
    <script src="script.js"></script>
        <script src="dados.js"></script>
        <script src="EditarReserva.js"></script>
</body>

</html>
