<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Configurações</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">
        
        <header>
            <div id="Navegacao"></div>
        </header>

        <div id="cabecalho"></div>

        <main>
                <p>Home / Configurações</p>

                <form>
                    <fieldset>
                        <h2>Configurações</h2>

                        <p>
                            <label>
                                Valor da diária<br>
                                <input type="number" step="0.01">
                            </label>
                        </p>

                        <p>
                            <label>
                                Vagas Disponíveis<br>
                                <input type="number" min="0">
                            </label>
                        </p>

                        <p class="BotoesSalvarLimpar">
                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>

                            <button type="button" data-navegacao="voltar">
                                Voltar
                            </button>
                        </p>
                        
                    </fieldset>
                </form>

      </main>          
      
<script src="script.js"></script>

</body>

</html>
