<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Configurações</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">
</head>

<body>

    <div class="layout">
        
                    <header>
                        <h1>Hotel Pet</h1>

                        <a href="Pets.html">
                            <img src="Imagens/pet.jpg" alt="Ícone de pet"> Pets
                        </a>

                        <a href="Usuarios.html">
                            <img src="Imagens/usuários.jpg" alt="Ícone de usuários" >Usuários
                        </a>
            
                        <a href="Configuracoes.html">
                            <img src="Imagens/configuracoes.jpg" alt="Ícone de configurações" align="center">Configurações
                        </a>
                    
                        <a href="Reserva.html">
                            <img src="Imagens/reservas.jpg" alt="Ícone de reservas">Reservas
                        </a>
                    </header>

        <section>
            <p>
                <img src="Imagens/usuário.jpg"
                     width="50"
                     height="50"
                     alt="Imagem do usuário">
                João da Silva
            </p>
        </section>

        <main>
                <p>Home / Configurações</p>

                <form>
                    <fieldset>
                        <h2>Configurações</h2>

                        <p>
                            <label>
                                Valor da diária<br>
                                <input type="number" step="0.01">
                            </label>
                        </p>

                        <p>
                            <label>
                                Vagas Disponíveis<br>
                                <input type="number" min="0">
                            </label>
                        </p>

                        <p class="BotoesSalvarLimpar">
                            <button type="submit">
                                <img src="Imagens/salvar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de salvar">
                                Salvar
                            </button>

                            <button type="reset">
                                <img src="Imagens/limpar.jpg"
                                     width="20"
                                     height="20"
                                     alt="Ícone de limpar">
                                Limpar
                            </button>
                        </p>
                        
                    </fieldset>
                </form>

      </main>          
</body>

</html>
