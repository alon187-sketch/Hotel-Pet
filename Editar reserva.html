<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Reserva</title>
</head>
<body>


    <header>
        
        <p> <img src="Imagens/usuário.jpg" height="50" width="50" alt="Imagem do usuário" align="right"> </p>
        <p> João da Silva</p>

        <a href="#">Pet</a><br>
        <a href="#">Usuários</a><br>
        <a href="#">Configurações</a><br>
        <a href="#">Reservas</a>

    </header>
<p>Home / revervas / editar reserva</p>

    <h2>Editar reserva</h2>

    <form>
        <p><label> Proprietário * <br> <input type="text" > </label></p>
        <p><label> Pet * <br> <input type="text" > </label></p>
        <p><label> Período * <br> <input type="date" > <input type="date" > </label></p>
        <p><label> Notas <br> <textarea rows="10" cols="50" ></textarea> </label></p>


        <label>Status*</label><br>
            <select name="status">
                <option value="em-andamento" selected>Em andamento</option>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
            </select>
    
        <p><label> Anotações do funcionário <br> <textarea rows="10" cols="50"></textarea> </label></p>


        <p>
            <img src="Imagens/quadrodo comx.jpg" width="80" height="80" alt="Imagem com X" align="left" >
            <button type="button" style="width:80px; height:80px;">+</button>
        </p>

        <p>Total das diárias: <strong>R$ 40,00</strong></p>


        <p>
            <button type="submit"><img src="Imagens/salvar.jpg" width="20" height="20" alt="Ícone de salvar"> Salvar </button>
            <button type="reset"><img src="Imagens/limpar.jpg" width="20" height="20" alt="Ícone de limpar"> Limpar</button>
        </p>
    </form>

</body>
</html>
