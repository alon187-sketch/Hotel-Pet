<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Pet</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="estilousuario.css">

    <style>
        table td:first-child {
            text-align: right;
        }

        table td:nth-child(2) {
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="layout">

        <header>
            <h1>Hotel Pet</h1>

            <a href="Pets.html">
                <img src="Imagens/pet.jpg" alt="Ícone de pet">
                Pets
            </a>

            <a href="Reserva.html">
                <img src="Imagens/reservas.jpg" alt="Ícone de reservas">
                Reservas
            </a>
        </header>

        <div id="cabecalho"></div>

        <main>

            <p>Home / Pets / Ver Pet</p>

            <form>
                <fieldset>

                    <h2>Ver Pet</h2>


                    <table>

                        <tr>
                            <td>Proprietário:</td>
                            <td id="viewProprietario">--</td>
                        </tr>

                        <tr>
                            <td>Id:</td>
                            <td id="viewId">--</td>
                        </tr>

                        <tr>
                            <td>Nome:</td>
                            <td id="viewNome">--</td>
                        </tr>

                        <tr>
                            <td>Tipo:</td>
                            <td id="viewTipo">--</td>
                        </tr>

                        <tr>
                            <td>Raça:</td>
                            <td id="viewRaca">--</td>
                        </tr>

                        <tr>
                            <td>Imagem:</td>
                            <td>
                                <img src="Imagens/quadrodo comx.jpg" height="50" width="50" alt="Imagem da reserva">
                            </td>
                        </tr>

                        <tr>
                            <td rowspan="2">Reservas:</td>
                            <td style="color: blue;" id="viewReserva1">02/05/2021 - 07/05/2021 (completa)</td>
                        </tr>

                        <tr>
                            <td style="color: green; text-align: left;" id="viewReserva2">07/05/2021 - 07/05/2021 (em andamento)</td>
                        </tr>

                    </table>

                    <br>
                        <section class="BotoesPesquisarLimpar">

                    <a type="button" class="voltar" href="Pets.html" width="20" height="20"> ← Voltar</a>

                    <a id="btnEditarPet" class="voltar" href="#">                        
                        <img src="Imagens/editar.jpg" width="20" height="20" alt="Ícone novo"> Editar
                    </a>

                    <button type="button" id="btnDeletarPet">
                        <img src="Imagens/deletar.jpg" width="20" height="20" alt="Ícone de Deletar">
                        Deletar
                    </button>


                </fieldset>
            </form>

        </main>

    </div>

    <!-- Carregamento dos Scripts -->
    <script src="dadosPets.js"></script>
    <script src="script.js"></script>
    <script src="VerPet.js"></script>

</body>

</html>
